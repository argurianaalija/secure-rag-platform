# Postgres + pgvector for semantic search (Week 3).
#
# Start:  docker compose up -d
# Status: docker compose ps
# Stop:   docker compose down          (data stays in the volume)
# Reset:  docker compose down -v        (also deletes the data)
#
# The DB is exposed on localhost:5433 (port 5433 to avoid clashing with an
# existing Postgres on 5432).

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ragpass   # local dev only; use a secret in production
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      # "ready" only when Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rag_pgdata:
